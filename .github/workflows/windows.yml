name: Windows package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.cs', '*.manifest', '*.ps1', '*.iss', '.github/workflows/windows.yml']
permissions:
  contents: write
  statuses: write
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Report run URL
        run: gh api "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f state=pending -f context=windows-package -f target_url="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" --silent
      - name: Compile, install and verify
        run: .\Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopBoxes-Windows
          path: out/*
          if-no-files-found: error
      - name: Publish downloads
        run: |
          $tag = "build-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          $assets = (Get-ChildItem out -File).FullName
          gh release create $tag @assets --target $env:GITHUB_SHA --title "Desktop Boxes 1.0 ($tag)" --notes "Windows desktop preview. SHA256SUMS.txt contains the SHA-256 checksums."
      - name: Report outcome
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          $state = if ($env:OUTCOME -eq 'success') {'success'} else {'failure'}
          gh api "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f state=$state -f context=windows-package -f target_url="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" --silent
